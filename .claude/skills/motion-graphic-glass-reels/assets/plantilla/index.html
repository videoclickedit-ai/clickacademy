<!doctype html>
<!--
  PLANTILLA · Motion Graphic Glass Reels (ejemplo real: reel "Este video lo hizo Claude", 27 s / 810 f)
  Cómo adaptarla:
  1. :root  -> paleta.  BG (en el script) -> colores del fondo por estado (azul / violeta / rojo).
  2. <section class="scene" id="sN"> -> una por escena. Borrá/duplicá bloques según el guion.
  3. SCENES + TOTAL -> frames de corte (4 frames antes de cada frase de la VO).
  4. Captions: phraseGroup(el, [{a, b, words: [[palabra, frame, 'hl'|'hlr'], ['\n']]}])
     o buildCaption(el, [[palabra, frame]]) + animWords(lista, f) para títulos.
  5. renderFrame(f) -> todo se calcula desde el número de frame (nada de CSS animations).
     Helpers: P(f, a, b, easing) progreso 0-1 · spring(f - inicio) pop con rebote · mix(hexA, hexB, t).
  6. Bloques listos: personaje (.char/.red/.sad + animChar), vidrio (.glass/.ice/.red/.sm), burbujas,
     contador (s2), dashboard con prompt + click (s3), gráfico que crece (s4), CTA con bloque y badge (s5).
-->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reel Claude</title>
<style>
:root {
  --cobalto: #1240AB; --electrico: #2A5BDB; --ice: #A4C6FF; --cielo: #6E9BEA;
  --niebla: #E4ECFB; --navy: #0B2E73; --magenta: #B31240; --rojo: #E0262B;
  --rosa: #F6C9D3; --violeta: #6B3FA0; --caption: #1A1F2E;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--niebla); }
body { font-family: "Inter", sans-serif; -webkit-font-smoothing: antialiased; color: var(--caption); }
#stage { position: absolute; inset: 0; overflow: hidden; }
#bg { position: absolute; inset: 0; }
#grain {
  position: absolute; inset: -200px; opacity: .07; mix-blend-mode: overlay; pointer-events: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.scene { position: absolute; inset: 0; transform-origin: 50% 45%; opacity: 0; }
.abs { position: absolute; }
.cx { left: 0; right: 0; text-align: center; }

/* ---------- Tipografía ---------- */
.cap { font-family: "Inter"; font-weight: 600; font-size: 56px; line-height: 68px; letter-spacing: -.01em; color: var(--caption); }
.w { display: inline-block; opacity: 0; white-space: pre; }
.hl { color: var(--cobalto); }
.hlr { color: var(--magenta); }
.impact { font-family: "Inter Display"; font-weight: 900; letter-spacing: -.045em; line-height: .9; color: var(--navy); }
.italic { font-family: "Inter Display"; font-style: italic; font-weight: 700; color: var(--cobalto); letter-spacing: -.02em; }

/* ---------- Vidrio ---------- */
.glass {
  position: absolute; border-radius: 40px; overflow: hidden;
  background: linear-gradient(135deg, var(--g1, rgba(234,241,255,.45)), var(--g2, rgba(42,91,219,.80)));
  box-shadow: 0 24px 60px var(--sh, rgba(11,46,115,.22)), inset 0 0 18px rgba(255,255,255,.35);
  backdrop-filter: blur(24px) saturate(140%);
}
.glass::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 2px; pointer-events: none;
  background: linear-gradient(180deg, rgba(255,255,255,.8), rgba(255,255,255,.15));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
}
.glass.ice { --g1: rgba(255,255,255,.38); --g2: rgba(255,255,255,.14); }
.glass.red { --g1: rgba(255,236,240,.55); --g2: rgba(179,18,64,.80); --sh: rgba(115,11,40,.25); }
.glass.sm { border-radius: 28px; }
.shine { position: absolute; top: -30%; bottom: -30%; width: 160px; transform: skewX(-20deg);
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); }

.bubble {
  position: absolute; border-radius: 50%;
  background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.4) 16%, rgba(164,198,255,.28) 45%, var(--bc, rgba(42,91,219,.55)) 100%);
  box-shadow: inset -8px -12px 30px var(--bi, rgba(18,64,171,.35)), inset 6px 8px 18px rgba(255,255,255,.7), 0 20px 50px rgba(11,46,115,.18);
}
.bubble.red { --bc: rgba(179,18,64,.55); --bi: rgba(140,10,40,.35); }

/* ---------- Personaje ---------- */
.char { position: absolute; width: 480px; height: 820px; transform-origin: 50% 40%;
  --core: #2A5BDB; --mid: rgba(110,155,234,.92); --glow: rgba(42,91,219,.5); }
.char.red { --core: #B31240; --mid: rgba(232,120,150,.92); --glow: rgba(224,38,43,.55); }
.char .body {
  position: absolute; left: 20px; top: 250px; width: 440px; height: 560px; border-radius: 220px 220px 90px 90px;
  background: linear-gradient(180deg, rgba(255,255,255,.88) 0%, rgba(228,238,255,.58) 28%, rgba(164,198,255,.28) 65%, rgba(164,198,255,0) 100%);
  box-shadow: inset 0 3px 0 rgba(255,255,255,.95), inset 0 30px 60px rgba(255,255,255,.55), inset 0 -40px 80px rgba(42,91,219,.12);
  -webkit-mask-image: linear-gradient(180deg, #000 50%, transparent 100%);
  backdrop-filter: blur(14px);
}
.char .head {
  position: absolute; left: 130px; top: 0; width: 220px; height: 220px; border-radius: 50%;
  background: radial-gradient(circle at 50% 55%, var(--core) 0%, var(--core) 16%, var(--mid) 46%, rgba(222,233,255,.94) 78%, #fff 100%);
  box-shadow: 0 0 0 3px rgba(255,255,255,.7), 0 0 60px var(--glow), 0 26px 50px rgba(11,46,115,.22), inset -10px -14px 30px rgba(18,64,171,.22);
}
.char .spec { position: absolute; left: 36px; top: 24px; width: 74px; height: 40px; border-radius: 50%; transform: rotate(-30deg);
  background: radial-gradient(closest-side, rgba(255,255,255,.95), rgba(255,255,255,0)); }
.char .eye { position: absolute; top: 90px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 0 10px rgba(255,255,255,.9); }
.char .eye.l { left: 78px; } .char .eye.r { left: 124px; }
.char .mouth { position: absolute; left: 87px; top: 122px; width: 46px; height: 22px; border: 5px solid #fff; border-top: none; border-radius: 0 0 30px 30px; }
.char.sad .mouth { top: 136px; border: 5px solid #fff; border-bottom: none; border-radius: 30px 30px 0 0; height: 16px; }
.char .drop { position: absolute; left: 186px; top: 40px; width: 22px; height: 30px; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
  background: linear-gradient(180deg, #fff, var(--ice)); opacity: 0; }

/* ---------- UI ---------- */
.ui { font-family: "Inter"; color: #fff; }
.chip { display: inline-flex; align-items: center; gap: 10px; padding: 12px 22px; border-radius: 999px; font: 600 26px "Inter";
  color: #fff; border: 2px solid rgba(255,255,255,.55); background: rgba(255,255,255,.12); }
.chip.done { background: #fff; color: var(--cobalto); border-color: #fff; }
.sw { width: 72px; height: 72px; border-radius: 50%; border: 3px solid rgba(255,255,255,.85); box-shadow: 0 8px 20px rgba(11,46,115,.25); }
.sec { display: flex; align-items: center; gap: 14px; font: 700 32px "Inter"; color: #fff; }
.num { width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,.22); display: grid; place-items: center; font: 800 22px "Inter"; }
.step { position: absolute; left: 0; right: 0; height: 44px; display: flex; align-items: center; gap: 18px; font: 600 28px "Inter"; color: #fff; }
.step .bar { flex: 1; height: 10px; border-radius: 5px; background: rgba(255,255,255,.2); overflow: hidden; }
.step .bar i { display: block; height: 100%; width: 0; background: #fff; border-radius: 5px; }
</style>
</head>

<script>
// ============ utilidades ============
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const E = {
  lin: t => t,
  out: t => 1 - Math.pow(1 - t, 3),
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  expo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
};
const P = (f, a, b, e = E.out) => e(clamp((f - a) / (b - a)));
// resorte 0 -> ~1.15 -> 1 (pop)
const spring = (fr, k = 9, w = 15) => fr <= 0 ? 0 : 1 - Math.exp(-k * fr / 30) * Math.cos(w * fr / 30);
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',')})`; };
const mixA = (a, b, t, al) => { const A = hex(a), B = hex(b); return `rgba(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',')},${al})`; };
const set = (el, s) => { for (const k in s) el.style[k] = s[k]; };

// ============ captions palabra por palabra ============
function buildCaption(el, words) {
  el.innerHTML = '';
  return words.map(([txt, fr, cls]) => {
    if (txt === '\n') { el.appendChild(document.createElement('br')); return null; }
    const s = document.createElement('span');
    s.className = 'w' + (cls ? ' ' + cls : '');
    s.textContent = txt;
    el.appendChild(s);
    el.appendChild(document.createTextNode(' '));
    return { s, fr };
  }).filter(Boolean);
}
function animWords(list, f) {
  for (const { s, fr } of list) {
    const t = P(f, fr - 1, fr + 5);
    const sp = spring(f - fr + 1, 11, 16);
    s.style.opacity = t;
    s.style.transform = `translateY(${(1 - t) * 26}px) scale(${f < fr - 1 ? .9 : lerp(.9, 1, Math.min(sp, 1.06))})`;
  }
}
// grupos de frases: cada una visible en [a, b)
function phraseGroup(el, phrases) {
  const items = phrases.map(p => {
    const wrap = document.createElement('div');
    wrap.style.position = 'absolute'; wrap.style.left = 0; wrap.style.right = 0;
    el.appendChild(wrap);
    return { ...p, wrap, words: buildCaption(wrap, p.words) };
  });
  return f => items.forEach(it => {
    const vis = f >= it.a - 2 && f < it.b;
    it.wrap.style.display = vis ? 'block' : 'none';
    if (!vis) return;
    const out = P(f, it.b - 4, it.b);
    it.wrap.style.opacity = 1 - out;
    it.wrap.style.transform = `translateY(${-out * 20}px)`;
    animWords(it.words, f);
  });
}

function curve(pts) {
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${p2[0]},${p2[1]}`;
  }
  return d;
}

function animChar(id, f, { born = 0, blink = [], happy = true, shake = 0, bob = 1 } = {}) {
  const el = $(id);

  const sp = spring(f - born, 8, 13);
  const t = f / 30;
  const by = Math.sin(t * 2.4) * 10 * bob;
  const sx = shake ? (Math.sin(f * 2.7) * shake + Math.sin(f * 4.1) * shake * .6) : 0;
  set(el, { transform: `translate(${sx}px, ${lerp(120, 0, Math.min(sp, 1))}px) scale(${lerp(.6, 1, sp)})`, opacity: P(f, born, born + 6) });

function bgAt(f) {

  const m = f < 286 ? P(f, 114, 128, E.inOut) : 1 - P(f, 286, 298, E.inOut);
  const [A, B, t] = m < .5 ? [BG.azul, BG.violeta, m * 2] : [BG.violeta, BG.rojo, (m - .5) * 2];
  const c = k => mix(A[k], B[k], t);
  const tt = f / 30;
  const hx = 84 + Math.sin(tt * .5) * 4, hy = 6 + Math.cos(tt * .4) * 3;

  const p1 = hex(A.pool).map((v, i) => Math.round(lerp(v, hex(B.pool)[i], t)));
  const p2 = hex(A.pool2).map((v, i) => Math.round(lerp(v, hex(B.pool2)[i], t)));
  $('bg').style.background = [

    `radial-gradient(58% 34% at ${px}% ${py}%, rgba(${p1},.95) 0%, rgba(${p1},.45) 45%, rgba(${p1},0) 100%)`,

    const tt = (xr - pts[idx][0]) / (760 / (BASE.length - 1));
    const dy = lerp(pts[idx][1], pts[idx + 1][1], clamp(tt));
    ['s4dot', 's4halo'].forEach(id => { $(id).setAttribute('cx', xr); $(id).setAttribute('cy', dy); });
    $('s4dot').style.opacity = P(f, 492, 496);
    $('s4halo').setAttribute('r', 22 + 14 * (1 + Math.sin(f / 4)) / 2 + up * 14);
    $('s4halo').style.opacity = P(f, 492, 496);
    const xn = Math.round(lerp(1, 10, P(f, 576, 606)));
    $('s4x').textContent = 'x' + xn;
    $('s4x').style.transform = `scale(${1 + (f >= 576 && f < 612 ? Math.sin((f - 576) / 36 * Math.PI) * .12 : 0)})`;
    $('s4x').style.transformOrigin = '0 70%';
    const bb = spring(f - 606, 10, 17);
    set($('s4badge'), { opacity: P(f, 606, 609), transform: `scale(${f < 606 ? .3 : lerp(.3, 1, bb)})` });
    $('s4shine').style.left = lerp(-300, 1100, P(f, 578, 602, E.inOut)) + 'px';
    for (let i = 0; i < 7; i++) {
      const st = 580 + i * 3, lt = P(f, st, st + 22, E.out), ang = i / 7 * Math.PI * 2 + .4;
      const sp = $('s4sp' + i);
      sp.setAttribute('transform', `translate(${xr + Math.cos(ang) * 90 * lt},${dy + Math.sin(ang) * 90 * lt}) scale(${(1 - lt) * 1.6 * (f >= st ? 1 : 0)}) rotate(${f * 6})`);
    }
    animBubble('s4b1', f, 2, 18); animBubble('s4b2', f, 5, 12);
  }

  // ---------- Escena 5 ----------
  if (f >= 648) {
    s5cap(f);
    const cs = spring(f - 701, 9, 14);
    set($('s5com'), { opacity: P(f, 701, 704), transform: `scale(${f < 701 ? .4 : lerp(.4, 1, cs)})` });
    const ks = spring(f - 721, 9, 15);
    const glow = 40 + (f > 730 ? 18 * (1 + Math.sin((f - 730) / 7)) : 0);
    set($('s5blk'), { opacity: P(f, 721, 724), transform: `scale(${f < 721 ? .3 : lerp(.3, 1, ks)}) rotate(${lerp(-6, -2, Math.min(ks, 1))}deg)` });
    $('s5blk').firstElementChild.style.setProperty('--gl', glow + 'px');
    animWords(s5sub, f);
    animChar('s5char', f, { born: 653, blink: [690, 760, 795] });
    const ms = spring(f - 721, 8, 14);
    set($('s5msg'), { opacity: P(f, 721, 725), transform: `translateY(${Math.sin(f / 30 * 2) * 8}px) scale(${f < 721 ? 0 : ms})` });
    const bgs = spring(f - 727, 10, 18);
    $('s5badge').style.transform = `scale(${f < 727 ? 0 : bgs})`;
    [0, 1, 2].forEach(i => $('s5d' + i).setAttribute('transform', `translate(0 ${Math.sin(f / 4 - i * .9) * 6})`));
    animBubble('s5b1', f, 1, 16); animBubble('s5b2', f, 4, 24);
  }
};

window.TOTAL_FRAMES = TOTAL;
renderFrame(0);
</script>
