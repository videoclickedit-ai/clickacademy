<!--
  Reel "Estás perdiendo plata" · 1080x1920 · 30 fps · 30 s (900 f)
  Hecho con la skill motion-graphic-glass-reels a partir de su plantilla.
  Cortes: s1 0-156 · s2 156-358 · s3 358-520 · s4 520-713 · s5 713-900
-->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reel Plata</title>
<style>
:root {
  --cobalto: #1240AB; --electrico: #2A5BDB; --ice: #A4C6FF; --cielo: #6E9BEA;
  --niebla: #E4ECFB; --navy: #0B2E73; --magenta: #B31240; --rojo: #E0262B;
  --rosa: #F6C9D3; --violeta: #6B3FA0; --caption: #1A1F2E;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--niebla); }
body { font-family: "Inter", sans-serif; -webkit-font-smoothing: antialiased; color: var(--caption); }
#stage { position: absolute; inset: 0; overflow: hidden; }
#bg { position: absolute; inset: 0; }
#grain {
  position: absolute; inset: -200px; opacity: .07; mix-blend-mode: overlay; pointer-events: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.scene { position: absolute; inset: 0; transform-origin: 50% 45%; opacity: 0; }
.abs { position: absolute; }
.cx { left: 0; right: 0; text-align: center; }

/* ---------- Tipografía ---------- */
.cap { font-family: "Inter"; font-weight: 600; font-size: 56px; line-height: 68px; letter-spacing: -.01em; color: var(--caption); }
.w { display: inline-block; opacity: 0; white-space: pre; }
.hl { color: var(--cobalto); }
.hlr { color: var(--magenta); }
.impact { font-family: "Inter Display"; font-weight: 900; letter-spacing: -.045em; line-height: .9; color: var(--navy); }
.italic { font-family: "Inter Display"; font-style: italic; font-weight: 700; color: var(--cobalto); letter-spacing: -.02em; }
.glassglyph {
  font-family: "Inter Display"; font-weight: 900; line-height: 1; color: transparent;
  background: linear-gradient(125deg, #FFFFFF 0%, #EEF4FF 16%, #FFFFFF 22%, #A9C6FF 38%, #4F7FE6 62%, #1240AB 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-stroke: 5px rgba(255,255,255,.92);
  filter: drop-shadow(0 30px 50px rgba(11,46,115,.35)) drop-shadow(0 0 26px rgba(164,198,255,.85));
}

/* ---------- Vidrio ---------- */
.glass {
  position: absolute; border-radius: 40px; overflow: hidden;
  background: linear-gradient(135deg, var(--g1, rgba(234,241,255,.45)), var(--g2, rgba(42,91,219,.80)));
  box-shadow: 0 24px 60px var(--sh, rgba(11,46,115,.22)), inset 0 0 18px rgba(255,255,255,.35);
  backdrop-filter: blur(24px) saturate(140%);
}
.glass::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 2px; pointer-events: none;
  background: linear-gradient(180deg, rgba(255,255,255,.8), rgba(255,255,255,.15));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
}
.glass.ice { --g1: rgba(255,255,255,.38); --g2: rgba(255,255,255,.14); }
.glass.red { --g1: rgba(255,236,240,.55); --g2: rgba(179,18,64,.80); --sh: rgba(115,11,40,.25); }
.glass.sm { border-radius: 28px; }
.shine { position: absolute; top: -30%; bottom: -30%; width: 160px; transform: skewX(-20deg);
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); }

.bubble {
  position: absolute; border-radius: 50%;
  background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.4) 16%, rgba(164,198,255,.28) 45%, var(--bc, rgba(42,91,219,.55)) 100%);
  box-shadow: inset -8px -12px 30px var(--bi, rgba(18,64,171,.35)), inset 6px 8px 18px rgba(255,255,255,.7), 0 20px 50px rgba(11,46,115,.18);
}
.bubble.red { --bc: rgba(179,18,64,.55); --bi: rgba(140,10,40,.35); }

/* ---------- Personaje ---------- */
.char { position: absolute; width: 480px; height: 820px; transform-origin: 50% 40%;
  --core: #2A5BDB; --mid: rgba(110,155,234,.92); --glow: rgba(42,91,219,.5); }
.char.red { --core: #B31240; --mid: rgba(232,120,150,.92); --glow: rgba(224,38,43,.55); }
.char .body {
  position: absolute; left: 20px; top: 250px; width: 440px; height: 560px; border-radius: 220px 220px 90px 90px;
  background: linear-gradient(180deg, rgba(255,255,255,.88) 0%, rgba(228,238,255,.58) 28%, rgba(164,198,255,.28) 65%, rgba(164,198,255,0) 100%);
  box-shadow: inset 0 3px 0 rgba(255,255,255,.95), inset 0 30px 60px rgba(255,255,255,.55), inset 0 -40px 80px rgba(42,91,219,.12);
  -webkit-mask-image: linear-gradient(180deg, #000 50%, transparent 100%);
  backdrop-filter: blur(14px);
}
.char .head {
  position: absolute; left: 130px; top: 0; width: 220px; height: 220px; border-radius: 50%;
  background: radial-gradient(circle at 50% 55%, var(--core) 0%, var(--core) 16%, var(--mid) 46%, rgba(222,233,255,.94) 78%, #fff 100%);
  box-shadow: 0 0 0 3px rgba(255,255,255,.7), 0 0 60px var(--glow), 0 26px 50px rgba(11,46,115,.22), inset -10px -14px 30px rgba(18,64,171,.22);
}
.char .spec { position: absolute; left: 36px; top: 24px; width: 74px; height: 40px; border-radius: 50%; transform: rotate(-30deg);
  background: radial-gradient(closest-side, rgba(255,255,255,.95), rgba(255,255,255,0)); }
.char .eye { position: absolute; top: 90px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 0 10px rgba(255,255,255,.9); }
.char .eye.l { left: 78px; } .char .eye.r { left: 124px; }
.char .mouth { position: absolute; left: 87px; top: 122px; width: 46px; height: 22px; border: 5px solid #fff; border-top: none; border-radius: 0 0 30px 30px; }
.char.sad .mouth { top: 136px; border: 5px solid #fff; border-bottom: none; border-radius: 30px 30px 0 0; height: 16px; }
.char .drop { position: absolute; left: 186px; top: 40px; width: 22px; height: 30px; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
  background: linear-gradient(180deg, #fff, var(--ice)); opacity: 0; }

/* ---------- UI ---------- */
.ui { font-family: "Inter"; color: #fff; }
.sec { display: flex; align-items: center; gap: 14px; font: 700 32px "Inter"; color: #fff; }
.lbl { font: 600 30px "Inter"; color: rgba(255,255,255,.9); }
.big { font: 900 124px "Inter Display"; letter-spacing: -.045em; line-height: 1; color: #fff; font-variant-numeric: tabular-nums; }
.row { position: absolute; left: 0; right: 0; height: 150px; border-radius: 28px; background: rgba(255,255,255,.14);

.row .ic { width: 78px; height: 78px; border-radius: 22px; background: rgba(255,255,255,.22); display: grid; place-items: center; flex: none; }
.row .tt { font: 800 38px "Inter Display"; letter-spacing: -.01em; }
.row .st { font: 500 24px "Inter"; opacity: .82; margin-top: 4px; }
.row .stat { margin-left: auto; width: 64px; height: 64px; position: relative; flex: none; }
.row .bar { position: absolute; left: 0; bottom: 0; height: 6px; width: 0; background: #fff; }
.pill { display: inline-flex; align-items: center; gap: 10px; padding: 14px 26px; border-radius: 999px; background: #fff; color: var(--cobalto); font: 800 32px "Inter"; }
</style>
</head>

<script>
// ============ utilidades ============
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const E = {

    $('s3stxt').textContent = done ? 'Listo' : 'Procesando';
    $('s3dot').style.background = done ? '#fff' : '#A4C6FF';
    $('s3dot').style.opacity = done ? 1 : .4 + .6 * Math.abs(Math.sin(f / 6));
    set($('s3title'), { opacity: P(f, 404, 410) });
    ROWS3.forEach((r, i) => {
      const row = $('s3r' + i), s = spring(f - r.a, 9, 15);
      set(row, { opacity: P(f, r.a, r.a + 4), transform: `translateX(${lerp(-60, 0, Math.min(s, 1))}px) scale(${f < r.a ? .8 : lerp(.8, 1, s)})` });
      const pr = P(f, r.a + 2, r.d, E.inOut);
      row.querySelector('.bar').style.width = (pr * 100) + '%';
      const ok = f >= r.d;
      const spin = row.querySelector('.spin'), okc = row.querySelector('.ok');
      spin.style.opacity = ok ? 0 : 1;
      spin.style.transform = `rotate(${f * 18}deg)`;
      okc.style.opacity = ok ? 1 : 0;
      okc.style.transform = `scale(${ok ? spring(f - r.d, 10, 18) : 0})`;
      row.style.background = ok ? `rgba(255,255,255,${lerp(.14, .24, P(f, r.d, r.d + 6))})` : 'rgba(255,255,255,.14)';
    });
    // botón + cursor + click (camera.wav en 492)
    const bs = spring(f - 470, 10, 16);
    const press = f >= 492 && f < 496 ? lerp(1, .9, P(f, 492, 495)) : f >= 496 ? lerp(.9, 1, Math.min(spring(f - 496, 10, 20), 1.06)) : 1;
    set($('s3btn'), { opacity: P(f, 470, 474), transform: `scale(${(f < 470 ? .5 : lerp(.5, 1, bs)) * press})`,
      boxShadow: `0 18px 40px rgba(11,46,115,.3), 0 0 ${lerp(0, 70, P(f, 492, 498) * (1 - P(f, 506, 520)) + (f > 498 ? .4 : 0))}px rgba(164,198,255,.95)` });
    const rp = P(f, 492, 510);
    set($('s3ripple'), { opacity: f >= 492 ? (1 - rp) : 0, transform: `scale(${rp * 50})` });
    $('s3fill').style.width = (P(f, 495, 512, E.inOut) * 100) + '%';
    $('s3ltxt').textContent = f >= 512 ? 'Listo ✓' : f >= 495 ? 'Generando…' : 'Generar';
    const cp = P(f, 472, 490, E.inOut);
    const cx = lerp(1000, 735, cp) + Math.sin(cp * Math.PI) * 60, cy = lerp(1820, 1340, cp);
    const cpress = f >= 492 && f < 498 ? .86 : 1;
    set($('s3cursor'), { opacity: P(f, 472, 476) * (1 - P(f, 510, 516)), transform: `translate(${cx - 900}px, ${cy - 1700}px) scale(${cpress})` });
    $('s3shine').style.left = lerp(-300, 1100, P(f, 496, 516, E.inOut)) + 'px';
    animBubble('s3b1', f, 1, 20); animBubble('s3b2', f, 3, 14);
  }

  // ---------- Escena 4 · Lección ----------
  if (f >= 516 && f < 717) {
    s4caps(f);
    const xs = spring(f - 558, 9, 14);
    const sweep = P(f, 562, 590, E.inOut);
    set($('s4imp'), { opacity: P(f, 558, 561), transform: `scale(${f < 558 ? .3 : lerp(.3, 1, xs)})` });
    $('s4x3').style.backgroundPosition = `${lerp(100, 0, sweep)}% 0`;
    const fs = spring(f - 572, 10, 16);
    set($('s4fast'), { opacity: P(f, 572, 576), transform: `translateX(${lerp(-40, 0, Math.min(fs, 1))}px)` });
    const cs = spring(f - 522, 7, 11);
    set($('s4card'), { opacity: P(f, 521, 529), transform: `perspective(1800px) translateY(${lerp(200, 0, Math.min(cs, 1)) + Math.sin(f / 30 * 1.2) * 6}px) rotateX(${lerp(20, 7, Math.min(cs, 1))}deg) scale(${lerp(.9, 1, Math.min(cs, 1))})` });
    // gráfico + contador $0 -> $221 (valores del SRT, acelerados)
    const reveal = P(f, 528, 604, E.inOut);
    const up = f < 648 ? 0 : Math.min(spring(f - 648, 5, 8), 1.08);
    const pts = BASE.map((v, i) => [i * (760 / (BASE.length - 1)), 340 - (v + BOOST[i] * up) * 330]);
    const dpath = curve(pts);
    $('s4line').setAttribute('d', dpath);
    $('s4area').setAttribute('d', dpath + ' L760,360 L0,360 Z');
    $('s4clip').setAttribute('width', reveal * 790);
    const xr = reveal * 760, idx = Math.min(Math.floor(xr / (760 / (BASE.length - 1))), BASE.length - 2);
    const tt = (xr - pts[idx][0]) / (760 / (BASE.length - 1));
    const dy = lerp(pts[idx][1], pts[idx + 1][1], clamp(tt));
    ['s4dot', 's4halo'].forEach(id => { $(id).setAttribute('cx', xr); $(id).setAttribute('cy', dy); });
    $('s4dot').style.opacity = P(f, 530, 534);
    $('s4halo').setAttribute('r', 22 + 14 * (1 + Math.sin(f / 4)) / 2 + up * 14);
    $('s4halo').style.opacity = P(f, 530, 534);
    const val = f < 604 ? lerp(0, 38, P(f, 528, 604, E.lin)) : f < 648 ? lerp(38, 60, P(f, 604, 648, E.lin)) : lerp(60, 221, P(f, 648, 698, E.out));
    $('s4v').textContent = '$' + Math.round(val);
    $('s4v').style.transform = `scale(${1 + (f >= 648 && f < 704 ? Math.sin((f - 648) / 56 * Math.PI) * .1 : 0)})`;
    $('s4v').style.transformOrigin = '0 70%';
    $('s4v').style.display = 'inline-block';
    const bb = spring(f - 613, 10, 17);
    set($('s4badge'), { opacity: P(f, 613, 616), transform: `scale(${f < 613 ? .3 : lerp(.3, 1, bb)})` });
    $('s4shine').style.left = lerp(-300, 1100, P(f, 668, 692, E.inOut)) + 'px';
    for (let i = 0; i < 7; i++) {
      const st = 670 + i * 3, lt = P(f, st, st + 22, E.out), ang = i / 7 * Math.PI * 2 + .4;
      $('s4sp' + i).setAttribute('transform', `translate(${xr + Math.cos(ang) * 90 * lt},${dy + Math.sin(ang) * 90 * lt}) scale(${(1 - lt) * 1.6 * (f >= st ? 1 : 0)}) rotate(${f * 6})`);
    }
    animBubble('s4b1', f, 2, 18); animBubble('s4b2', f, 5, 12);
  }

  // ---------- Escena 5 · CTA ----------
  if (f >= 709) {
    s5cap(f);
    const cs = spring(f - 787, 9, 14);
    set($('s5com'), { opacity: P(f, 787, 790), transform: `scale(${f < 787 ? .4 : lerp(.4, 1, cs)})` });
    const ks = spring(f - 809, 9, 15);
    const glow = 40 + (f > 818 ? 18 * (1 + Math.sin((f - 818) / 7)) : 0);
    set($('s5blk'), { opacity: P(f, 809, 812), transform: `scale(${f < 809 ? .3 : lerp(.3, 1, ks)}) rotate(${lerp(-6, -2, Math.min(ks, 1))}deg)` });
    $('s5blk').firstElementChild.style.setProperty('--gl', glow + 'px');
    animWords(s5sub, f);
    animChar('s5char', f, { born: 716, blink: [770, 846, 884] });
    const ds = spring(f - 718, 8, 13);
    const hop = f >= 838 ? Math.sin(clamp((f - 838) / 16) * Math.PI) : 0;
    set($('s5dm'), { opacity: P(f, 718, 723), transform: `translateY(${Math.sin(f / 30 * 2) * 8 - hop * 30}px) rotate(${lerp(14, 4, Math.min(ds, 1)) - hop * 8}deg) scale(${f < 718 ? .3 : lerp(.3, 1, ds) + hop * .06})` });
    $('s5plane').style.transform = `translate(${hop * 34}px, ${-hop * 34}px) rotate(${-hop * 12}deg)`;
    const bgs = spring(f - 813, 10, 18);
    $('s5badge').style.transform = `scale(${f < 813 ? 0 : bgs})`;
    animBubble('s5b1', f, 1, 16); animBubble('s5b2', f, 4, 24);
  }
};

window.TOTAL_FRAMES = TOTAL;
renderFrame(0);
</script>
